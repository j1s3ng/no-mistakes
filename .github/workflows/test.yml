name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Build and inspect distributions
        if: matrix.python == '3.13'
        run: |
          python -m pip install build
          python -m build
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import tarfile
          import zipfile

          required = {"README.md", "LICENSE", "AGENTS.md"}
          for directory, patterns in {
              "docs": ("*.md", "*.json"),
              "skills/no-mistakes": ("*.md",),
              "examples": ("*.py",),
              "tests": ("*.py",),
          }.items():
              for pattern in patterns:
                  required.update(str(path) for path in Path(directory).rglob(pattern))
          with tarfile.open(next(Path("dist").glob("*.tar.gz"))) as archive:
              source_files = {str(PurePosixPath(name).relative_to(PurePosixPath(name).parts[0]))
                              for name in archive.getnames()}
          assert required <= source_files, f"Missing source files: {required - source_files}"
          with zipfile.ZipFile(next(Path("dist").glob("*.whl"))) as archive:
              wheel_files = set(archive.namelist())
          assert "no_mistakes/cli.py" in wheel_files
          private_parts = {".no-mistakes", ".git", ".venv", "__pycache__", "build", "dist", ".pytest_cache"}
          for name in source_files | wheel_files:
              parts = PurePosixPath(name).parts
              assert not (private_parts & set(parts)), f"Private/cache file: {name}"
              assert not any(part == ".env" or part.startswith(".env.") for part in parts), name
              assert not name.endswith((".pyc", ".pyo")), name
          PY
      - name: Install package
        run: |
          if [ "${{ matrix.python }}" = "3.13" ]; then
            python -m pip install --no-deps dist/*.whl
          else
            python -m pip install --no-deps .
          fi
      - name: Exercise installed CLI and integration example
        working-directory: ${{ runner.temp }}
        run: |
          no-mistakes prepare 'Check this. no mistakes.' > prepared.json
          python "$GITHUB_WORKSPACE/examples/tool_hooks.py" > tool-hooks.json
          python - <<'PY'
          import json
          from pathlib import Path

          prepared = json.loads(Path("prepared.json").read_text())
          assert prepared["active"] is True
          example = json.loads(Path("tool-hooks.json").read_text())
          assert example["retrieval"]["evidence"]
          assert example["retrieval"]["verified"] is False
          assert example["correct_calculation"]["verdict"] == "passed"
          assert example["incorrect_calculation"]["verdict"] == "failed"
          PY
