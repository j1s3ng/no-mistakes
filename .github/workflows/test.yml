name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: |
          python - <<'PY'
          import unittest

          suite = unittest.defaultTestLoader.discover("tests")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.testsRun == 0 or len(result.skipped) == result.testsRun:
              raise SystemExit("No tests executed without skipping")
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
      - name: Build and inspect distributions
        if: matrix.python == '3.13'
        run: |
          python -m pip install build
          python -m build
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import tarfile
          import zipfile

          required = {"README.md", "LICENSE", "AGENTS.md", "setup.py"}
          for directory, patterns in {
              "docs": ("*.md", "*.json"),
              "skills/no-mistakes": ("*.md",),
              "examples": ("*.py", "*.html"),
              "evals": ("*.json",),
              "tests": ("*.py",),
              "no_mistakes": ("*.py",),
          }.items():
              for pattern in patterns:
                  required.update(str(path) for path in Path(directory).rglob(pattern))
          with tarfile.open(next(Path("dist").glob("*.tar.gz"))) as archive:
              source_files = {str(PurePosixPath(name).relative_to(PurePosixPath(name).parts[0]))
                              for name in archive.getnames()}
              prefix = PurePosixPath(archive.getnames()[0]).parts[0]
              assert required <= source_files, f"Missing source files: {required - source_files}"
              for source in required:
                  assert archive.extractfile(f"{prefix}/{source}").read() == Path(source).read_bytes(), source
          with zipfile.ZipFile(next(Path("dist").glob("*.whl"))) as archive:
              wheel_files = set(archive.namelist())
              expected_skill = set()
              for source in Path("skills/no-mistakes").rglob("*.md"):
                  bundled = "no_mistakes/_skill/" + str(source.relative_to("skills/no-mistakes"))
                  expected_skill.add(bundled)
                  assert archive.read(bundled) == source.read_bytes(), bundled
              assert {name for name in wheel_files if name.startswith("no_mistakes/_skill/")} == expected_skill
              for source in Path("no_mistakes").rglob("*.py"):
                  assert archive.read(str(source)) == source.read_bytes(), source
          private_parts = {".no-mistakes", ".git", ".venv", "__pycache__", "build", "dist", ".pytest_cache"}
          for name in source_files | wheel_files:
              parts = PurePosixPath(name).parts
              assert not (private_parts & set(parts)), f"Private/cache file: {name}"
              assert not any(part == ".env" or part.startswith(".env.") for part in parts), name
              assert not name.endswith((".pyc", ".pyo")), name
          PY
      - name: Install package
        run: |
          if [ "${{ matrix.python }}" = "3.13" ]; then
            python -m pip install --no-deps dist/*.whl
          else
            python -m pip install --no-deps .
          fi
      - name: Exercise installed CLI and integration example
        working-directory: ${{ runner.temp }}
        run: |
          no-mistakes prepare 'Check this. no mistakes.' > prepared.json
          no-mistakes retrieve --corpus "$GITHUB_WORKSPACE/docs/corpus.example.json" --query retry --scope project:demo > retrieved.json
          no-mistakes toolbox list --profile web > toolbox.json
          no-mistakes toolbox recommend --profile web --available browser > recommendations.json
          python "$GITHUB_WORKSPACE/examples/tool_hooks.py" > tool-hooks.json
          python - <<'PY'
          import json
          from pathlib import Path
          import os
          import no_mistakes

          assert not Path(no_mistakes.__file__).resolve().is_relative_to(Path(os.environ["GITHUB_WORKSPACE"]).resolve())

          prepared = json.loads(Path("prepared.json").read_text())
          assert prepared["active"] is True
          retrieved = json.loads(Path("retrieved.json").read_text())
          assert retrieved["evidence"]
          assert retrieved["verified"] is False
          assert all(item["scope"] == "project:demo" for item in retrieved["evidence"])
          catalog = json.loads(Path("toolbox.json").read_text())
          assert any(tool["id"] == "playwright" for tool in catalog["tools"])
          needs = json.loads(Path("recommendations.json").read_text())["capabilities"]
          browser = next(item for item in needs if item["capability"] == "browser")
          assert browser["available"] is True
          assert browser["optional_mcp_candidates"] == []
          example = json.loads(Path("tool-hooks.json").read_text())
          assert example["retrieval"]["evidence"]
          assert example["retrieval"]["verified"] is False
          assert example["correct_calculation"]["verdict"] == "passed"
          assert example["incorrect_calculation"]["verdict"] == "failed"
          PY
      - name: Exercise installed MCP setup without launching third-party code
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          from datetime import date
          import json
          from pathlib import Path
          import subprocess
          import tempfile
          from no_mistakes.tool_catalog import get_tool
          from no_mistakes.toolbox import build_proposal, apply_proposal

          with tempfile.TemporaryDirectory() as temporary:
              root = Path(temporary)
              project = root / "project"
              project.mkdir()
              tool = get_tool("openai-docs")
              tool["id"] = "synthetic-docs"
              tool["name"] = "Synthetic packaging fixture; not a live connection"
              tool["review"]["checked_on"] = date.today().isoformat()
              tool["review"]["source_urls"] = ["https://example.com/synthetic-docs"]
              tool["connection"]["url"] = "https://example.com/mcp"
              proposal = build_proposal([tool], "claude", project, "Synthetic smoke", "Temporary fixture only")
              saved = root / "plan.json"
              saved.write_text(json.dumps(proposal), encoding="utf-8")
              setup = subprocess.run(["no-mistakes", "toolbox", "setup", str(saved)], check=True, capture_output=True, text=True)
              assert json.loads(setup.stdout)["digest"] == proposal["digest"]
              before = subprocess.run(["no-mistakes", "toolbox", "doctor", str(saved)], capture_output=True, text=True)
              assert before.returncode == 1
              assert json.loads(before.stdout)["config"]["status"] == "missing"
              assert list(project.iterdir()) == []
              # Test-only callback in an isolated fixture. No host loads this file.
              assert apply_proposal(proposal, lambda _: True)["status"] == "created"
              after = subprocess.run(["no-mistakes", "toolbox", "doctor", str(saved)], check=True, capture_output=True, text=True)
              observed = json.loads(after.stdout)
              assert observed["local_ready"] is True
              assert observed["tools"][0]["runtime_status"] == "not_checked"
              assert observed["tools"][0]["authentication_status"] == "not_checked"
              assert observed["tools"][0]["smoke_status"] == "not_run"
          PY
      - name: Exercise installed host setup outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          mkdir installed-smoke
          no-mistakes install --host codex --host copilot --host claude --host cursor --host gemini --host generic --project installed-smoke --dry-run
          python - <<'PY'
          from pathlib import Path

          assert not list(Path("installed-smoke").iterdir()), "Dry-run wrote project files"
          PY
          no-mistakes install --host codex --host copilot --host claude --host cursor --host gemini --host generic --project installed-smoke
          python - <<'PY'
          from importlib import resources
          from pathlib import Path

          project = Path("installed-smoke")
          for route in (
              "AGENTS.md",
              "CLAUDE.md",
              "GEMINI.md",
              ".github/copilot-instructions.md",
              ".cursor/rules/no-mistakes.mdc",
              ".claude/commands/no-mistakes.md",
          ):
              assert (project / route).is_file(), route
          bundled = resources.files("no_mistakes").joinpath("_skill")
          installed = project / ".agents/skills/no-mistakes"

          def compare(source, target):
              for item in source.iterdir():
                  destination = target / item.name
                  if item.is_dir():
                      compare(item, destination)
                  else:
                      assert destination.read_bytes() == item.read_bytes(), destination

          compare(bundled, installed)
          PY
      - name: Inspect installed setup without changing it
        working-directory: ${{ runner.temp }}
        run: |
          no-mistakes doctor --host codex --host copilot --host claude --host cursor --host gemini --host generic --project installed-smoke > doctor.json
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess

          assert json.loads(Path("doctor.json").read_text())["ok"] is True
          project = Path("installed-smoke")
          (project / ".agents/skills/no-mistakes/references/web-research.md").unlink()
          (project / "AGENTS.md").unlink()
          before = {str(path): path.read_bytes() for path in project.rglob("*") if path.is_file()}
          result = subprocess.run(
              ["no-mistakes", "doctor", "--host", "codex", "--project", str(project)],
              capture_output=True, text=True,
          )
          assert result.returncode == 1, result.stderr
          report = json.loads(result.stdout)
          assert report["ok"] is False
          paths = {issue["path"] for issue in report["issues"]}
          assert "AGENTS.md" in paths
          assert ".agents/skills/no-mistakes/references/web-research.md" in paths
          after = {str(path): path.read_bytes() for path in project.rglob("*") if path.is_file()}
          assert before == after, "Doctor changed the project"
          PY
